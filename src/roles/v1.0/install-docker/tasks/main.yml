- name: Ensure Docker group exists
  become: yes
  become_user: root
  ansible.builtin.group:
    name: docker
    gid: "{{ docker_gid }}"
    state: present

- name: Ensure Ansible User Has Docker group
  become: yes
  become_user: root
  ansible.builtin.user:
    name: "{{ ansible_ssh_user }}"
    groups: wheel,docker
    append: yes

- name: Reset ssh connection to allow user changes to affect 'current login user'
  ansible.builtin.meta: reset_connection

- name: set mydistribution var
  ansible.builtin.set_fact:
    mydistribution: "{{ 'rhel' if (ansible_distribution == 'Red Hat Enterprise Linux') else 'centos' }}"

- name: Add docker signing key from url
  become: yes
  become_user: root
  ansible.builtin.rpm_key:
    key: "https://download.docker.com/linux/{{ mydistribution }}/gpg"
    state: present

- name: Add docker repository into repos.d list
  become: yes
  become_user: root
  ansible.builtin.yum_repository:
    name: docker
    description: docker repository
    baseurl: "https://download.docker.com/linux/{{ mydistribution }}/$releasever/$basearch/stable"
    enabled: true
    gpgcheck: true
    gpgkey: "https://download.docker.com/linux/{{ mydistribution }}/gpg"
  register: add_docker_repo

- name: Update all packages to their latest version
  become: yes
  become_user: root
  ansible.builtin.yum:
    name: "*"
    state: latest
    update_cache: true
  when: add_docker_repo.changed

- name: Update yum and install docker
  become: yes
  become_user: root
  ansible.builtin.yum:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - python3-pip
    state: latest
    update_cache: true

- name: Start Docker
  become: yes
  become_user: root
  ansible.builtin.service:
    name: "docker"
    enabled: true
    state: started

- name: Install requirements to run ansible docker plugin
  become: yes
  become_user: root
  ansible.builtin.pip:
    name:
      - docker
      - paramiko
      - requests
      - jsondiff
      # - openssl

- name: Clean up /var/lib/docker/overlay every day at 05:00 am 
  ansible.builtin.cron:
    name: docker clean up
    job: docker system prune --all --force --volumes
    user: ansible
    minute: "0"
    hour: "5"

- name: Initialize A New Swarm Cluster
  community.docker.docker_swarm:
    state: present
  when: inventory_hostname in groups['docker_station']

- name: Setup Main Public Overlay Network
  community.docker.docker_network:
    name: main-public
    driver: overlay
  when: inventory_hostname in groups['docker_station']

- name: Log into private registry
  community.docker.docker_login:
    username: ansible
    password: "{{ item.access_token }}"
    registry_url: "{{ item.registry_url }}"
  loop: "{{ private_registries }}"
  loop_control:
      label: "{{ item.registry_url }}"
